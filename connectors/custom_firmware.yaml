# PRO-MS6 TunerStudio pin names: "<connector pin> - <function>"
# J102 main 48-pin pins are named as-is (A4), J101 aux 26-pin pins get an AUX prefix (AUX 15).
# ETB (PD14/PC9/PB14) and idle stepper (PE4/PE3/PE2/PB8) are hard-wired and pinned in
# board_configuration.cpp, so they are intentionally left out of the output lists.
pins:
# ---------------- outputs ----------------
  - id: D3
    class: outputs
    ts_name: A4 - Injector 1

  - id: D2
    class: outputs
    ts_name: B4 - Injector 2

  - id: C13
    class: outputs
    ts_name: M2 - Ignition 1

  - id: E5
    class: outputs
    ts_name: M4 - Ignition 2

  - id: C8
    class: outputs
    ts_name: E1 - Main Relay

  - id: D10
    class: outputs
    ts_name: C4 - Fuel Pump

  - id: D12
    class: outputs
    ts_name: D4 - Fan

  - id: D15
    class: outputs
    ts_name: K3 - Check Engine

  - id: D11
    class: outputs
    ts_name: C2 - Starter Relay

  - id: C10
    class: outputs
    ts_name: J4 - Tachometer

  - id: A8
    class: outputs
    ts_name: L1 - O2 1 Heater

  - id: A9
    class: outputs
    ts_name: M1 - O2 2 Heater

  - id: C6
    class: outputs
    ts_name: L3 - Canister

  - id: C7
    class: outputs
    ts_name: L2 - SAS

  - id: D13
    class: outputs
    ts_name: E4 - Headlight Relay

# ---------------- analog inputs ----------------
  - id: EFI_ADC_10
    class: analog_inputs
    ts_name: K1 - MAP

  - id: EFI_ADC_4
    class: analog_inputs
    ts_name: G1 - TPS

  - id: EFI_ADC_12
    class: analog_inputs
    ts_name: F1 - CLT

  - id: EFI_ADC_13
    class: analog_inputs
    ts_name: H1 - IAT

  - id: EFI_ADC_1
    class: analog_inputs
    ts_name: K2 - O2 1 NB

  - id: EFI_ADC_11
    class: analog_inputs
    ts_name: J2 - O2 2 NB

  - id: EFI_ADC_5
    class: analog_inputs
    ts_name: G3 - Battery (12V SW)

  - id: EFI_ADC_3
    class: analog_inputs
    ts_name: AUX 1 - AN1

  - id: EFI_ADC_15
    class: analog_inputs
    ts_name: AUX 2 - AN2

  - id: EFI_ADC_6
    class: analog_inputs
    ts_name: AUX 3 - AN3

  - id: EFI_ADC_14
    class: analog_inputs
    ts_name: AUX 15 - AT1

  - id: EFI_ADC_9
    class: analog_inputs
    ts_name: AUX 4 - AT2

  - id: EFI_ADC_7
    class: analog_inputs
    ts_name: Gear Position

  - id: EFI_ADC_8
    class: analog_inputs
    ts_name: AUX 9 - QS Sensor

# Rev B only: FuelLevel moved from PE11 (no ADC) to PA2
#  - id: EFI_ADC_2
#    class: analog_inputs
#    ts_name: AUX 20 - Fuel Level

# ---------------- event inputs ----------------
  - id: E1
    class: event_inputs
    ts_name: F4/G4 - Crank VR

  - id: E12
    class: event_inputs
    ts_name: H4 - VSS

# PA15 and PB15 share EXTI15: only one of them can be used as an event input at a time
  - id: [A15, A15]
    class: [switch_inputs, event_inputs]
    ts_name: AUX 22 - Digital 1

  - id: [B15, B15]
    class: [switch_inputs, event_inputs]
    ts_name: AUX 21 - Digital 2

# ---------------- switch inputs ----------------
  - id: E0
    class: switch_inputs
    ts_name: B3 - Clutch

  - id: E13
    class: switch_inputs
    ts_name: D3 - Neutral

  - id: E14
    class: switch_inputs
    ts_name: F2 - Side Stand

  - id: E15
    class: switch_inputs
    ts_name: A3 - Roll Over

  - id: C11
    class: switch_inputs
    ts_name: K4 - Mode Switch
